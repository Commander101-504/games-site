            background-color: #1f1f1f;
        }

    <script>
        let player = "X";
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        function move(x) {
            if(document.getElementById(x).innerHTML === "N") {
                if(document.getElementById("turn").innerHTML != "X wins!" && document.getElementById("turn").innerHTML != "O wins!") {
                    document.getElementById(x).innerHTML = player;
                    document.getElementById(x).style.color = "white";
                    if(player === "X") {
                        player = "O"
            }
                    else {
                        player = "X"
            }
                document.getElementById("turn").innerHTML = player + "'s turn!";
                sleep(10).then(() => {WinDetect()});
        }}}
        
        function WinDetect() {
            if (document.getElementById(1).innerHTML === "X" && document.getElementById(5).innerHTML === "X" && document.getElementById(9).innerHTML === "X") {

        }
            if (document.getElementById(7).innerHTML === "X" && document.getElementById(8).innerHTML === "X" && document.getElementById(9).innerHTML === "X") {

                document.getElementById(7).style.color = "lime";

        }

        }

        }

        }

        }
        }
    </script>
</head>
<body>
    <h1>Tic Tac Toe Board</h1>
    <table style="width:42.5%">
      <tr>
        <td id="1" onclick="move(1)">N</td>
        <td id="2" onclick="move(2)">N</td>
        <td id="3" onclick="move(3)">N</td>
      </tr>
      <tr>
        <td id="4" onclick="move(4)">N</td>
        <td id="5" onclick="move(5)">N</td>
        <td id="6" onclick="move(6)">N</td>
      </tr>
      <tr>
        <td id="7" onclick="move(7)">N</td>
        <td id="8" onclick="move(8)">N</td>
        <td id="9" onclick="move(9)">N</td>
      </tr>
    </table>
    <h2 id="turn">X goes first!</h2>
