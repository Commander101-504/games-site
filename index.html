<DOCTYPE html>

    <title>Games</title>
    <link href='https://fonts.googleapis.com/css?family=Lexend' rel='stylesheet'>
    <style>
        body {
            background-color: #1f1f1f;
        }
        button {
            box-shadow: 10px 10px 5px black;
            font-size: 25px;
            font-family: 'Lexend';
            border: 10px white;
            width: 17vw;
            aspect-ratio: 1;
            color: white;
            overflow: hidden;
            border-radius: 30px;
            transition: all 0.5s ease;
            transform: scale(1);
        }
        button:hover {
            box-shadow: 5px 5px 5px black;
            transform: scale(1.1);
        }
        h1 {
            letter-spacing: 5px;
            color: white;
            font-size: 40px;
            font-family: 'Lexend';
            text-align: center;
        }
        .norm {
            background-color: #2f2f2f;
        }
        .pop {
            background-color: #3f3f3f;
        }
        .supop {
            background-color: #4f4f4f;
        }
        .mustplay {
            background-color: #5f5f5f;
        }
        .custom {
            background-color: #4f4f4f;
        }
        .norm:hover {
            background-color: #3f3f3f;
        }
        .pop:hover {
            background-color: #4f4f4f;
        }
        .supop:hover {
            background-color: #5f5f5f;
        }
        .mustplay:hover {
            background-color: #6f6f6f;
        }
        .custom:hover {
            background-color: #5f5f5f;
        }
        .top1 {
            background-image: linear-gradient(
	            to top left,
	            #462523 0,
       	        #cb9b51 33%, 
	            #f6e27a 66%,
	            #f6f2c0 100%
	        );
        }
        .top1:hover {
            background-image: linear-gradient(
	            to top left,
	            #573634 0,
       	        #dcac62 33%, 
	            #f7f38b 66%,
	            #cb9b51 100%
	        );
        }
        .container {
            padding: 10px;
            gap: 10px;
            display: grid;
            grid-template-columns: auto auto auto auto auto;
            justify-content: center;
        }
        .search {
            height: 100px;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
